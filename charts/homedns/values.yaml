image:
  repository: ghcr.io/webd97/homedns
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Two replicas so a rolling update never leaves the network without DNS.
replicaCount: 2

strategy: {}

nameOverride: ""
fullnameOverride: ""

# --- Pi-hole replacement -----------------------------------------------------
blocklist:
  enabled: true

  # /etc/hosts-format and bare-domain lists are both auto-detected.
  urls:
    - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    # - https://big.oisd.nl/domainswild

  # Resolves the URLs above. Must be literal IPs of an external resolver: this
  # server cannot resolve them itself, and cluster DNS may forward back here.
  bootstrapDNS:
    - 1.1.1.1
    - 9.9.9.9

  # Names to never block. Each entry covers the name and its subdomains.
  allow: []

  refresh: 24h

  # How long to stay NotReady waiting for a first list before serving
  # unfiltered.
  readyTimeout: 60s

# --- external-dns replacement ------------------------------------------------
gatewayAPI:
  enabled: true

  # Required when enabled. Only hostnames inside these zones are answered from
  # cluster resources.
  zones: []
  # - home.example.com

  # Subset of: Ingress, Service, HTTPRoute, TLSRoute, GRPCRoute, DNSEndpoint.
  resources:
    - HTTPRoute

  # Restrict to specific gatewayClassName values; empty watches all.
  gatewayClasses: []
  ttl: 60
  fallthrough: true

# --- resolver ----------------------------------------------------------------
upstream:
  # DNS-over-TLS by default.
  servers:
    - tls://1.1.1.1
    - tls://1.0.0.1
  tlsServername: cloudflare-dns.com

cache:
  enabled: true
  ttl: 300

# Send every cache miss to all of upstream.servers at once and answer with the
# first useful reply, instead of forward's random pick of one. Measured against
# the two Quad9 anycast addresses their tails are independent, so the slow one
# stops deciding client latency; see plugin/race/README.md. This multiplies
# upstream query volume by the number of servers, which is the trade.
race:
  enabled: false
  # Idle upstream connections are dropped after this long. Do not raise it to
  # "keep connections warm": public resolvers hang up on idle DoT connections at
  # about this point, so a longer window only fills the pool with dead ones.
  expire: 10s

# Ask the other replicas before waiting on the upstream. Each replica has its
# own cache, and externalTrafficPolicy: Local pins clients to a node, so the
# caches diverge; this races siblings against the upstream and takes whichever
# answers first. Needs replicaCount > 1 to do anything, and grants the pod a
# namespaced pods list/watch to find its siblings.
peerCache:
  enabled: false
  # Sibling probes. Bound on the pod IP, exposed by no Service.
  port: 8053

# Static LAN records, inlined into the Corefile — no extra file or volume.
#   - ip: 10.0.0.5
#     names: [nas.home.example, files.home.example]
hosts: []

# Per-query logging. Off by default: a home LAN generates a lot of lines.
log: false

# Replaces the generated Corefile entirely. Everything above is ignored when set.
corefile: ""

# --- networking --------------------------------------------------------------
service:
  type: LoadBalancer
  # For load balancers that refuse a Service carrying both TCP and UDP.
  splitTcpUdp: false
  port: 53
  loadBalancerIP: ""
  loadBalancerClass: ""
  externalTrafficPolicy: Local
  annotations: {}

metrics:
  enabled: true
  port: 9153
  service:
    annotations: {}
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# --- workload ----------------------------------------------------------------
# Measured RSS: ~73 MB with the single default list (45k subtrees), ~150 MB with
# ~600k domains across two large lists. The limit matters more than the request:
# a refresh transiently holds the raw list text plus the rebuilt set, so peak is
# well above steady state. Raise both if you add large lists.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
    # Required to bind :53 as a non-root user.
    add: [NET_BIND_SERVICE]
