{{- /* Fails at render time rather than shipping a crash-looping pod. */ -}}
{{- if and .Values.gatewayAPI.enabled (not .Values.gatewayAPI.zones) }}
{{- fail "gatewayAPI.enabled is true but gatewayAPI.zones is empty. Set the zone(s) this server is authoritative for, e.g. --set gatewayAPI.zones={home.example.com}, or disable it with --set gatewayAPI.enabled=false" }}
{{- end }}
{{- if and .Values.blocklist.enabled (not .Values.blocklist.urls) }}
{{- fail "blocklist.enabled is true but blocklist.urls is empty. Add a list URL, or set blocklist.enabled=false" }}
{{- end }}
{{- if and .Values.blocklist.enabled .Values.blocklist.urls (not .Values.blocklist.bootstrapDNS) }}
{{- fail "blocklist.bootstrapDNS must name at least one resolver IP: this server cannot resolve its own blocklist URLs, and cluster DNS may forward back to it" }}
{{- end }}
{{- if and .Values.peerCache.enabled (not .Values.cache.enabled) }}
{{- fail "peerCache.enabled requires cache.enabled: peercache races siblings on a local cache miss, and with no cache there is nothing to miss, nothing for a sibling to hold, and nothing to keep the answer it wins" }}
{{- end }}
{{- if and .Values.peerCache.enabled (eq (int .Values.peerCache.port) (int .Values.service.port)) }}
{{- fail "peerCache.port must differ from service.port" }}
{{- end }}
{{- if and .Values.peerCache.enabled .Values.metrics.enabled (eq (int .Values.peerCache.port) (int .Values.metrics.port)) }}
{{- fail "peerCache.port must differ from metrics.port" }}
{{- end }}
{{- if and .Values.race.enabled (lt (len .Values.upstream.servers) 2) }}
{{- fail "race.enabled needs at least two upstream.servers: with one there is nothing to race, and `forward` is the plugin for that" }}
{{- end }}
{{- $seen := dict }}
{{- $gatewayZones := list }}
{{- if .Values.gatewayAPI.enabled }}
{{- range $z := .Values.gatewayAPI.zones }}
{{- $gatewayZones = append $gatewayZones ($z | lower | trimSuffix ".") }}
{{- end }}
{{- end }}
{{- range $i, $fz := .Values.forwardZones }}
{{- if not $fz.zones }}
{{- fail (printf "forwardZones[%d].zones is empty. Each entry needs the zone(s) it answers, e.g. zones: [corp.example.com]" $i) }}
{{- end }}
{{- if not $fz.servers }}
{{- fail (printf "forwardZones[%d].servers is empty. Each entry needs the resolver(s) to forward to, e.g. servers: [10.0.0.1]" $i) }}
{{- end }}
{{- range $z := $fz.zones }}
{{- $norm := $z | lower | trimSuffix "." }}
{{- if not $norm }}
{{- fail (printf "forwardZones[%d] names the root zone. That is the main server block, and defining it twice is a startup error; the resolver for everything else is upstream.servers" $i) }}
{{- end }}
{{- if hasKey $seen $norm }}
{{- fail (printf "forwardZones names zone %q more than once. CoreDNS refuses to start with a zone defined by two server blocks (\"cannot serve %s - it is already defined\"); put every server for a zone in one entry" $norm $norm) }}
{{- end }}
{{- $_ := set $seen $norm true }}
{{- if has $norm $gatewayZones }}
{{- fail (printf "forwardZones[%d] names zone %q, which is also a gatewayAPI.zones entry. Its server block is the more specific match, so k8s_gateway would silently stop answering for the whole zone; forward a subzone of it, or drop it from gatewayAPI.zones" $i $norm) }}
{{- end }}
{{- end }}
{{- end }}
