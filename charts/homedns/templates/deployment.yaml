apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homedns.fullname" . }}
  labels:
    {{- include "homedns.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "homedns.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        # Rolls the pods when the Corefile changes.
        checksum/config: {{ include "homedns.corefile" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "homedns.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "homedns.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # DNS answers must not depend on cluster DNS: this pod is what the network
      # resolves through, and forwarding to kube-dns that forwards back here
      # would loop.
      dnsPolicy: Default
      containers:
      - name: homedns
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args: ["-conf", "/etc/coredns/Corefile"]
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        ports:
        - name: dns-udp
          containerPort: {{ .Values.service.port }}
          protocol: UDP
        - name: dns-tcp
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        {{- if .Values.metrics.enabled }}
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
          protocol: TCP
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        # Gated on the blocklist being loaded, so a starting pod is not sent
        # traffic it would answer unfiltered. It gives up after
        # blocklist.readyTimeout and reports ready anyway.
        readinessProbe:
          httpGet:
            path: /ready
            port: 8181
          initialDelaySeconds: 2
          periodSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/coredns
          readOnly: true
      volumes:
      # The only volume: blocklists live in memory and Gateway API records are
      # rebuilt from the API server, so there is nothing to persist.
      - name: config
        configMap:
          name: {{ include "homedns.fullname" . }}
          items:
          - key: Corefile
            path: Corefile
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
