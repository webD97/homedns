version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
    ignore:
      # Owned by .github/workflows/bump-coredns.yml, which gates the bump on the
      # full test suite and files an issue when it breaks. Two mechanisms
      # updating the same module would fight.
      - dependency-name: github.com/coredns/coredns

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
