name: Release

# Tags publish automatically. Everything else is opt-in: run this workflow by
# hand (Actions tab, or `gh workflow run release.yml --ref <branch>`) to push a
# build from any commit. CI builds the image on every PR but never pushes it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish. Must be SemVer. Default: 0.0.0-dev.<short-sha>'
        required: false
        default: ''
      chart:
        description: 'Also package and push the Helm chart'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The single source of truth for the version; the chart job consumes it
      # rather than parsing the ref a second time.
      - name: Resolve versions
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "coredns=$(go list -m -f '{{.Version}}' github.com/coredns/coredns)" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          elif [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="0.0.0-dev.${GITHUB_SHA::7}"
          fi

          # helm package rejects anything that is not SemVer2, and it is better
          # to fail here than after the image has already been pushed.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid SemVer version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $version from ${GITHUB_REF}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          # The semver patterns only fire on a tag push; type=raw carries the
          # resolved version for a manual run.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=${{ steps.v.outputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
          # Explicit rather than latest=auto: :latest moves only for a
          # non-prerelease tag push, so no manual dev build can ever claim it.
          flavor: |
            latest=${{ github.event_name == 'push' && !contains(steps.v.outputs.version, '-') }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
            COREDNS_VERSION=${{ steps.v.outputs.coredns }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          artifact-name: homedns-sbom.spdx.json

      - uses: sigstore/cosign-installer@v4

      - name: Sign
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.build.outputs.digest }}

  chart:
    name: Chart
    needs: image
    if: github.event_name == 'push' || inputs.chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Package and push
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          set -euo pipefail
          helm package charts/homedns \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination /tmp/chart
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "/tmp/chart/homedns-${VERSION}.tgz" "${CHART_REPO}"

      - name: Summary
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          {
            echo "### homedns $VERSION"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo "helm install homedns ${CHART_REPO}/homedns --version ${VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
