name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      skip_image:
        # Release builds and pushes the real image right after this gate, with
        # the version ldflags baked in. Building a throwaway one first is the
        # same multi-arch Go compile twice for no extra signal.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # Scoped by workflow, not just ref: Release calls this workflow, and a push to
  # main must not cancel the CI job inside an in-flight release from the same ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: `latest` means a linter release can break a green branch
          # with no change of ours.
          version: v2.13.1

      - name: go mod tidy is up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Test
        run: go test ./... -race -timeout 600s

      - name: Report embedded CoreDNS version
        run: |
          echo "CoreDNS $(go list -m -f '{{.Version}}' github.com/coredns/coredns)" >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - run: helm lint charts/homedns --set gatewayAPI.zones={home.example.com}

      - name: Render
        run: |
          helm template homedns charts/homedns \
            --set gatewayAPI.zones={home.example.com} > /dev/null
          helm template homedns charts/homedns \
            --set gatewayAPI.zones={home.example.com} \
            --set service.splitTcpUdp=true > /dev/null
          helm template homedns charts/homedns \
            --set gatewayAPI.enabled=false > /dev/null

      # The chart's job is producing a valid Corefile, so check the real binary
      # accepts the one it generates.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generated Corefile is valid
        run: |
          go build -o /tmp/homedns .
          helm template homedns charts/homedns \
            --set gatewayAPI.enabled=false \
            --set service.port=1054 \
            --set metrics.port=9154 \
            --set blocklist.enabled=false \
            | python3 -c "import sys,yaml;[print(d['data']['Corefile']) for d in yaml.safe_load_all(sys.stdin) if d and d.get('kind')=='ConfigMap']" \
            > /tmp/Corefile
          cat /tmp/Corefile
          /tmp/homedns -conf /tmp/Corefile &
          pid=$!
          sleep 3
          kill -0 $pid || { echo "server exited: the generated Corefile is invalid"; exit 1; }
          kill $pid

  image:
    name: Image
    # Null on push/pull_request, so this only ever skips for a caller that asked.
    if: ${{ !inputs.skip_image }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
